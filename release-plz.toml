[workspace]
release = false
release_always = false
changelog_update = false
pr_labels = ["release"]
max_analyze_commits = 2000

[[package]]
name = "use-feedback"
release = true
version_group = "rustuse-control"

[[package]]
name = "use-pid"
release = true
version_group = "rustuse-control"

[[package]]
name = "use-setpoint"
release = true
version_group = "rustuse-control"

[[package]]
name = "use-control-error"
release = true
version_group = "rustuse-control"

[[package]]
name = "use-control-signal"
release = true
version_group = "rustuse-control"

[[package]]
name = "use-system-response"
release = true
version_group = "rustuse-control"

[[package]]
name = "use-stability"
release = true
version_group = "rustuse-control"

[[package]]
name = "use-control"
release = true
version_group = "rustuse-control"
changelog_update = true
changelog_path = "./CHANGELOG.md"
changelog_include = [
  "use-feedback",
  "use-pid",
  "use-setpoint",
  "use-control-error",
  "use-control-signal",
  "use-system-response",
  "use-stability",
]

[changelog]
header = """# Changelog

## Unreleased
"""
protect_breaking_commits = true
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat(?:\\([^)]+\\))?!?: .+", group = "Added" },
  { message = "^fix(?:\\([^)]+\\))?!?: .+", group = "Fixed" },
  { message = "^security(?:\\([^)]+\\))?!?: .+", group = "Security" },
  { message = "^(?:refactor|perf|change)(?:\\([^)]+\\))?!?: .+", group = "Changed" },
  { message = "^docs(?:\\([^)]+\\))?!?: .+", group = "Documentation" },
  { message = "^(?:build|ci|chore|deps|test)(?:\\([^)]+\\))?!?: .+", group = "Tooling" },
  { footer = "^changelog: ?ignore$", skip = true },
  { message = "^.*", group = "Changed" },
]